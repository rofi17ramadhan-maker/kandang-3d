<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisasi 3D Kandang 4x8m + Kolam Lele</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 12px; border-radius: 8px;
            pointer-events: none; max-width: 300px;
        }
        #info h3 { margin: 0 0 5px 0; font-size: 16px; color: #4caf50; }
        #info p { margin: 2px 0; font-size: 12px; }
    </style>
    <!-- Library Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h3>Kandang Panggung 4x8m</h3>
        <p>• Red: Gudang Pakan (3x1.5m)</p>
        <p>• Blue: Kolam Lele (4x6.5m, -3.0m)</p>
        <p>• Yellow/Brown: Panggung & Baterai</p>
        <p>• Grey: Atap Aluminium Monitor</p>
        <p><i>Gunakan Mouse / Touch untuk Putar & Zoom 3D</i></p>
    </div>

    <script>
        // 1. SCENE, CAMERA, RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(2.0, 0.5, 4.0);
        controls.update();

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(12, 18, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Grid Dasar Tanah (Diturunkan ke Y = -3m menyesuaikan dasar kolam)
        const gridHelper = new THREE.GridHelper(25, 25, 0x444444, 0x333333);
        gridHelper.position.set(2.0, -3.0, 4.0);
        scene.add(gridHelper);

        // MATERIAL
        const matBeton = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const matAir = new THREE.MeshStandardMaterial({ color: 0x1e88e5, transparent: true, opacity: 0.7 });
        const matKayu = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
        const matBaterai = new THREE.MeshStandardMaterial({ color: 0xfbc02d });
        const matAtap = new THREE.MeshStandardMaterial({ color: 0xb0bec5, side: THREE.DoubleSide });
        const matGudang = new THREE.MeshStandardMaterial({ color: 0xe53935 });

        // 3. ELEMEN BANGUNAN

        // A. Gudang Pakan (3x1.5m)
        const gudang = new THREE.Mesh(new THREE.BoxGeometry(3, 2.8, 1.5), matGudang);
        gudang.position.set(1.5, 1.4, 7.25);
        scene.add(gudang);

        // B. Kolam Lele (Air) - Panjang 6.5m, Lebar 4m, Dalam 3.0m
        const air = new THREE.Mesh(new THREE.BoxGeometry(4.0, 3.0, 6.5), matAir);
        air.position.set(2.0, -1.5, 3.25);
        scene.add(air);

        // C. Tanggul Beton Samping Kolam Terbuka (Sisi Kanan)
        const tanggulKanan = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.2, 6.5), matBeton);
        tanggulKanan.position.set(4.25, 0.1, 3.25);
        scene.add(tanggulKanan);

        // D. Tiang Beton Utama (Jarak ~2.16m)
        for (let z = 0; z <= 6.5; z += 2.16) {
            const tiangKiri = new THREE.Mesh(new THREE.BoxGeometry(0.15, 6.2, 0.15), matBeton);
            tiangKiri.position.set(0.075, 0.1, z);
            scene.add(tiangKiri);

            const tiangKanan = new THREE.Mesh(new THREE.BoxGeometry(0.15, 6.2, 0.15), matBeton);
            tiangKanan.position.set(2.925, 0.1, z);
            scene.add(tiangKanan);
        }

        // E. Lantai Panggung Kayu/Bambu (Tinggi +1.8m)
        const panggungKiri = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 6.5), matKayu);
        panggungKiri.position.set(0.6, 1.8, 3.25);
        scene.add(panggungKiri);

        const panggungKanan = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.05, 6.5), matKayu);
        panggungKanan.position.set(2.4, 1.8, 3.25);
        scene.add(panggungKanan);

        // F. Blok Kandang Baterai Ayam (2 Baris Tipe A)
        const bateraiKiri = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 6.5), matBaterai);
        bateraiKiri.position.set(0.6, 2.38, 3.25);
        scene.add(bateraiKiri);

        const bateraiKanan = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 6.5), matBaterai);
        bateraiKanan.position.set(2.4, 2.38, 3.25);
        scene.add(bateraiKanan);

        // G. Atap Spandek Monitor
        const atap1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 8.0), matAtap);
        atap1.position.set(0.8, 3.2, 4.0);
        atap1.rotation.z = 0.15;
        scene.add(atap1);

        const atap2 = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 8.0), matAtap);
        atap2.position.set(2.2, 3.2, 4.0);
        atap2.rotation.z = -0.15;
        scene.add(atap2);

        const atapTop = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.05, 8.0), matAtap);
        atapTop.position.set(1.5, 3.5, 4.0);
        scene.add(atapTop);

        // RESIZE HANDLER & ANIMATION LOOP
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
