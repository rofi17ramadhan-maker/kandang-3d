<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Plan 3D Presisi - Lahan 10x35m</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.85); padding: 12px; border-radius: 8px;
            pointer-events: none; max-width: 320px; border: 1px solid #555;
        }
        #info h3 { margin: 0 0 5px 0; font-size: 15px; color: #4caf50; }
        #info p { margin: 3px 0; font-size: 11px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="info">
        <h3>Site Plan Presisi (Lahan 10x35m)</h3>
        <p>• <b>Tanah Hijau:</b> Total Lahan 10x35m</p>
        <p>• <b>Kuning Depan:</b> Pos Security (3x3m) & Parkiran</p>
        <p>• <b>Merah:</b> Gudang Pakan & Telur (3.5x3m)</p>
        <p>• <b>Biru Bawah:</b> Kolam Lele Lebar 6.5m (1.5m Terbuka)</p>
        <p>• <b>Cokelat/Kuning:</b> Kandang Ayam Panggung (5x20m)</p>
        <p>• <b>Abu-abu:</b> Jalan Akses Samping (1.5m)</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(5, 1, 17.5);
        controls.update();

        // LIGHTING
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 20);
        scene.add(dirLight);

        // MATERIALS
        const matRumput = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
        const matAspal = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const matBeton = new THREE.MeshStandardMaterial({ color: 0x757575 });
        const matPos = new THREE.MeshStandardMaterial({ color: 0xffb300 });
        const matGudang = new THREE.MeshStandardMaterial({ color: 0xc62828 });
        const matAir = new THREE.MeshStandardMaterial({ color: 0x0288d1, transparent: true, opacity: 0.85 });
        const matKayu = new THREE.MeshStandardMaterial({ color: 0x5d4037 });
        const matBaterai = new THREE.MeshStandardMaterial({ color: 0xfbc02d });
        const matAtap = new THREE.MeshStandardMaterial({ color: 0xb0bec5, side: THREE.DoubleSide });

        // 1. LAHAN TOTAL (10m x 35m) - Pusat (5, 0, 17.5)
        const lahan = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 35), matRumput);
        lahan.position.set(5, -0.05, 17.5);
        scene.add(lahan);

        // 2. JALAN AKSES SAMPING KIRI (Lebar 1.5m, Panjang 35m)
        const jalanSamping = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 35), matBeton);
        jalanSamping.position.set(0.75, 0.01, 17.5);
        scene.add(jalanSamping);

        // 3. PARKIRAN DEPAN (6.5m x 6m)
        const parkiran = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.12, 6), matAspal);
        parkiran.position.set(6.75, 0.01, 3);
        scene.add(parkiran);

        // 4. POS SECURITY (3m x 3m, Tinggi 2.8m)
        const posSecurity = new THREE.Mesh(new THREE.BoxGeometry(3, 2.8, 3), matPos);
        posSecurity.position.set(3, 1.4, 1.5);
        scene.add(posSecurity);

        // 5. GUDANG PAKAN & TELUR (3.5m x 3m, Tinggi 2.8m)
        const gudang = new THREE.Mesh(new THREE.BoxGeometry(3.5, 2.8, 3), matGudang);
        gudang.position.set(4.25, 1.4, 7.5);
        scene.add(gudang);

        // 6. KOLAM LELE DIPERLEBAR (Lebar 6.5m x Panjang 20m x Dalam 0.8m)
        // Terletak dari Z=9 sampai Z=29 (Panjang 20m)
        const air = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.8, 20), matAir);
        air.position.set(5.75, -0.4, 19);
        scene.add(air);

        // Tanggul Pijakan Beton Pinggir Kolam Terbuka
        const tanggul = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 20), matBeton);
        tanggul.position.set(9.4, 0.02, 19);
        scene.add(tanggul);

        // 7. STRUKTUR KANDANG PANGGUNG (Panjang 20m, Z=9 s/d 29)
        
        // A. Tiang-tiang Beton Penopang (Tinggi Total 3.2m dari tanah)
        for (let z = 9; z <= 29; z += 2.5) {
            // Tiang Kiri Kandang (X = 2.5m)
            const tKiri = new THREE.Mesh(new THREE.BoxGeometry(0.15, 3.2, 0.15), matBeton);
            tKiri.position.set(2.5, 1.6, z);
            scene.add(tKiri);

            // Tiang Kanan Kandang (X = 7.5m)
            const tKanan = new THREE.Mesh(new THREE.BoxGeometry(0.15, 3.2, 0.15), matBeton);
            tKanan.position.set(7.5, 1.6, z);
            scene.add(tKanan);
        }

        // B. Lantai Panggung Kayu/Bambu (Tinggi 1.8m di atas tanah)
        const panggungKiri = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 20), matKayu);
        panggungKiri.position.set(3.1, 1.8, 19);
        scene.add(panggungKiri);

        const panggungKanan = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 20), matKayu);
        panggungKanan.position.set(6.9, 1.8, 19);
        scene.add(panggungKanan);

        // C. Kandang Baterai Ayam (Tinggi 1.1m di atas panggung -> Y = 1.85 s/d 2.95m)
        const bateraiKiri = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 20), matBaterai);
        bateraiKiri.position.set(3.1, 2.4, 19);
        scene.add(bateraiKiri);

        const bateraiKanan = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 20), matBaterai);
        bateraiKanan.position.set(6.9, 2.4, 19);
        scene.add(bateraiKanan);

        // D. Atap Spandek Kandang (Nempel di Atas Tiang Y = 3.2m)
        const atapKiri = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.05, 20), matAtap);
        atapKiri.position.set(3.75, 3.3, 19);
        atapKiri.rotation.z = 0.15;
        scene.add(atapKiri);

        const atapKanan = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.05, 20), matAtap);
        atapKanan.position.set(6.25, 3.3, 19);
        atapKanan.rotation.z = -0.15;
        scene.add(atapKanan);

        const atapMonitor = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.05, 20), matAtap);
        atapMonitor.position.set(5.0, 3.6, 19);
        scene.add(atapMonitor);

        // RESIZE & ANIMATION
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
